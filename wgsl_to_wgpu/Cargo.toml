[package]
name = "wgsl_to_wgpu"
version = "0.20.0"
authors = ["ScanMountGoat <>"]
description = "Generate typesafe Rust bindings from WGSL shaders to wgpu"
license = "MIT"
documentation = "https://docs.rs/wgsl_to_wgpu"
repository = "https://github.com/ScanMountGoat/wgsl_to_wgpu"
readme = "../README.md"
edition = "2024"

[dependencies]
naga = { workspace = true, features = ["wgsl-in", "wgsl-out"] }
wgpu-types = { workspace = true }
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
thiserror = "2.0"
case = "1.0"
# naga_oil="0.20"
regex = "1.12"

[dev-dependencies]
indoc = "2.0"
pretty_assertions = "1.4"
